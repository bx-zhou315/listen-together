name: Weekly sermon update
on:
  schedule:
    - cron: "17 19 * * 0"   # Sunday evening (UK)
    - cron: "17 7 * * 1"    # Monday morning, in case the talk went up late
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python update.py
      - run: |
          git config user.name "sermon-updater"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git diff --cached --quiet || (git commit -m "Add new Sunday talk" && git push)
